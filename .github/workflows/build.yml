
name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27   # macOS 27 image with Xcode 27.1 (the version nxnative tests with) as default
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v5
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc   # maintained no-BC branch (newer than the old d158df6 snapshot: ASTC textures, Metroid Dread movie fixes)

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v5
        with:
          repository: seedds/nxnative
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross glslang unar
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools backports.zstd gdown

      - name: Select Xcode and check the Metal compiler and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          # nxnative's shaders were tested with Xcode 27.1: use it if this runner image has it
          for x in /Applications/Xcode_27.1*.app; do
            if [[ -d "$x" && "$x" != *Candidate* ]]; then sudo xcode-select -s "$x"; break; fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || sudo xcodebuild -downloadPlatform iOS
          xcrun -sdk iphoneos metal --version || sudo xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
          df -h "$RUNNER_TEMP"

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          if not file_id:
              raise SystemExit(
                  "Could not extract a Google Drive file ID."
              )

          print(file_id)
          PY
          )"

            echo "Downloading $(basename "$output")..."
            # Download into a folder of its own so the file keeps its Google Drive name
            # (nxnative reads [title ID][vVersion] from NSP names), then move it into place.
            local dl_dir="${output}.d"
            mkdir -p "$dl_dir"
            # Google Drive often drops large downloads part-way; resume until complete
            local attempt
            for attempt in 1 2 3 4 5 6 7 8; do
              if gdown --continue "$file_id" -O "$dl_dir/"; then
                break
              fi
              if [[ "$attempt" == 8 ]]; then
                echo "::error::Download of $(basename "$output") still incomplete after $attempt attempts."
                exit 1
              fi
              echo "::warning::Download interrupted (attempt $attempt); resuming in 20 s..."
              sleep 20
            done

            local got=()
            local f
            for f in "$dl_dir"/*; do
              [[ -f "$f" && "$f" != *.part ]] && got+=("$f")
            done
            if [[ ${#got[@]} -ne 1 ]]; then
              echo "::error::Expected one downloaded file in $dl_dir, found ${#got[@]}."
              ls -la "$dl_dir"
              exit 1
            fi
            echo "Google Drive file name: $(basename "${got[0]}")"
            basename "${got[0]}" > "${output}.name"
            mv "${got[0]}" "$output"
            rm -rf "$dl_dir"

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import re
          import shutil
          import struct
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          TAGGED = re.compile(r"\[[0-9A-Fa-f]{16}\].*\[v\d+\]")

          def cnmt_info(path):
              """(title ID, version) from a plain-text .cnmt.xml inside an NSP, else None."""
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
                      if header[:4] != b"PFS0":
                          return None
                      count, string_size = struct.unpack_from("<II", header, 4)
                      if count > 100000 or string_size > 100000000:
                          return None
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
                      data_start = 0x10 + count * 0x18 + string_size
                      for i in range(count):
                          off, size, name_off = struct.unpack_from("<QQI", entries, i * 0x18)
                          name = strings[name_off:strings.find(b"\0", name_off)].decode(errors="replace")
                          if name.lower().endswith(".cnmt.xml") and size < 1_000_000:
                              f.seek(data_start + off)
                              xml = f.read(size).decode(errors="replace")
                              i_m = re.search(r"<Id>0x([0-9A-Fa-f]{16})</Id>", xml)
                              v_m = re.search(r"<Version>(\d+)</Version>", xml)
                              if i_m and v_m:
                                  return i_m.group(1).upper(), int(v_m.group(1))
              except (OSError, struct.error):
                  pass
              return None

          def tagged_name(path, fallback_stem, extension):
              """A file name nxnative can read: keep one that already has [titleID]...[vN],
              else build one from the NSP's cnmt.xml, else keep what we have."""
              if TAGGED.search(path.name) and path.suffix.lower() in package_extensions:
                  return path.name
              info = cnmt_info(path)
              if info:
                  return f"{fallback_stem} [{info[0]}][v{info[1]}]{extension}"
              print(
                  f"::warning::{path.name}: no [title ID][version] in its name and no cnmt.xml inside; "
                  "nxnative will need the NSP's ticket to identify it."
              )
              return f"{fallback_stem}{extension}"

          def add_package(source, label):
              target = game_dir / tagged_name(source, source.stem, source.suffix.lower())

              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )

              validate_package(source)
              shutil.move(str(source), str(target))

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )

              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)

                  print(f"{label}: RAR archive detected; extracting.")

                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )

                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )

                  for package in packages:
                      add_package(package, label)

                  source.unlink()   # free the archive's disk space

              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )

                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package. "
                          "Direct downloads must be NSP or XCI files."
                      )

                  name_file = work / f"{label}.download.name"
                  original = Path(name_file.read_text().strip()) if name_file.exists() else Path(label)
                  print(f"{label}: Google Drive name: {original.name}")
                  stem = original.stem if original.suffix.lower() in package_extensions else original.name
                  probe = source.with_name(original.stem + extension) if TAGGED.search(original.name) else source
                  if probe is not source:
                      source.rename(probe)
                      source = probe
                  target = game_dir / tagged_name(source, stem or label, extension)

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.move(str(source), str(target))
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
          DEVICE: ${{ inputs.device }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_entries(path):
              """(name, absolute data offset, size) for each file in a PFS0 (NSP/NSZ)."""
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []
                      count, string_size = struct.unpack_from("<II", header, 4)
                      if count > 100000 or string_size > 100000000:
                          return []
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
                      if len(entries) != count * 0x18:
                          return []
                      data_start = 0x10 + count * 0x18 + string_size
                      out = []
                      for i in range(count):
                          data_off, data_size, name_off = struct.unpack_from("<QQI", entries, i * 0x18)
                          if name_off >= len(strings):
                              continue
                          end = strings.find(b"\0", name_off)
                          if end < 0:
                              continue
                          out.append((strings[name_off:end].decode(errors="replace"), data_start + data_off, data_size))
                      return out
              except (OSError, struct.error):
                  return []

          def add(candidates, hex_id):
              title_id = int(hex_id, 16)
              if (title_id & 0xFFF) == 0:   # base game IDs end in 000 (updates 800, DLC others)
                  candidates.add(f"{title_id:016X}")

          candidates = set()

          for path in sorted(root.iterdir()):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              entries = pfs0_entries(path)
              print(f"{path.name}: {[e[0] for e in entries]}", file=sys.stderr)

              for name, data_pos, data_size in entries:
                  # 1. ticket: <title ID><key generation>.tik
                  m = re.fullmatch(r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik", name)
                  if m:
                      add(candidates, m.group(1))
                  # 2. plain-text metadata many NSPs carry: <hash>.cnmt.xml with <Id>0x...</Id>
                  if name.lower().endswith(".cnmt.xml") and data_size < 1_000_000:
                      with path.open("rb") as f:
                          f.seek(data_pos)
                          xml = f.read(data_size).decode(errors="replace")
                      for m in re.finditer(r"<Id>0x([0-9A-Fa-f]{16})</Id>", xml):
                          add(candidates, m.group(1))

              # 3. [titleID] in the file name
              m = re.search(r"\[([0-9A-Fa-f]{16})\]", path.name)
              if m:
                  add(candidates, m.group(1))

          if len(candidates) == 1:
              print(next(iter(candidates)))
          else:
              print(f"Title ID not found in tickets, cnmt.xml or file names. Candidates: {sorted(candidates)}", file=sys.stderr)
          PY
          )" || DETECTED_ID=""

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"

          if [[ -z "$PROFILE_ID" ]]; then
            if [[ "$DEVICE" == "iPhone 15 or older (BC fallback)" ]]; then
              echo "::error::Title ID not detected. Re-run and type the base game's title ID in the profile ID box (Metroid Dread: 010093801237C000)."
              exit 1
            fi
            # The standard build reads the title ID itself with prod.keys; this ID only feeds the BC-fallback shader step.
            echo "::warning::Title ID not detected from the files; the nxnative build script will detect it itself."
            exit 0
          fi

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Update shader toolchain lock and header (BC fallback only)
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          python "$CHAIN_SCRIPT" --update-lock
          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        env:
          DEVICE: ${{ inputs.device }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"
          EXTRA=()

          # Standard (main) builds stop when the runner's Metal compiler is not the one in the lock
          # file. Main has no dmsh_chain.py --update-lock; its supported switch is --allow-other-metal.
          if [[ "$DEVICE" != "iPhone 15 or older (BC fallback)" ]]; then
            LOCK_METAL="$(grep '^metal_iphoneos' dm/gfx/tools/dmsh_chain.lock | cut -f2-)"
            NOW_METAL="$(xcrun -sdk iphoneos metal --version 2>&1 | head -1)"
            echo "Lock Metal:   $LOCK_METAL"
            echo "Runner Metal: $NOW_METAL"
            if [[ "$NOW_METAL" != "$LOCK_METAL" ]]; then
              echo "::warning::Runner Metal compiler differs from the tested one; building with --allow-other-metal."
              EXTRA+=(--allow-other-metal)
            fi
          fi

          df -h "$RUNNER_TEMP"
          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT" \
            --progress lines \
            ${EXTRA[@]+"${EXTRA[@]}"}

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
